name: CI

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Package version override (e.g. 1.2.3)'
        required: false
        default: ''

jobs:
  lint:
    name: Syntax checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check JavaScript syntax
        run: node --check htdocs/luci-static/resources/view/nook/general.js

      - name: Check ucode syntax
        run: |
          sudo apt-get update
          sudo apt-get install -y ucode
          ucode -c root/usr/share/rpcd/ucode/nook.uc

  build:
    name: Build package
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        arch:
          - x86_64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine package version
        id: vars
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            # Strip leading 'v' from tag names like v1.2.3
            echo "pkg_version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          elif [[ -n "${{ github.event.inputs.version }}" ]]; then
            echo "pkg_version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "pkg_version=" >> "$GITHUB_OUTPUT"
          fi

      - name: Build with OpenWrt SDK
        uses: openwrt/gh-action-sdk@v7
        with:
          arch: ${{ matrix.arch }}
          feedname: luci-app-nook
          packages: luci-app-nook
          build_command: ${{ steps.vars.outputs.pkg_version != '' && format('make package/luci-app-nook/compile V=s PKG_VERSION={0}', steps.vars.outputs.pkg_version) || 'make package/luci-app-nook/compile V=s' }}

      - name: Collect artifacts
        run: |
          mkdir -p dist
          find . -type f \( -name 'luci-app-nook_*.ipk' -o -name 'luci-app-nook_*.apk' \) -exec cp {} dist/ \;
          ls -la dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: luci-app-nook-${{ matrix.arch }}
          path: dist/*

  release:
    name: Attach to release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: luci-app-nook-*
          merge-multiple: true

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
